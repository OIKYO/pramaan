# Backup keep-awake: calls /health?db=true every 10 minutes so neither Render nor Supabase sleeps.
# The main job runs inside Supabase (supabase/migrations/2026-11-08d_keep_awake.sql), because GitHub
# runs free scheduled jobs late or skips them.
name: Keep awake

on:
  schedule:
    - cron: "7-59/10 * * * *" # minutes 7, 17, 27...: GitHub is busiest on the hour
  workflow_dispatch: # "Run workflow" button, to wake the API by hand before a demo

env:
  API_URL: https://pramaan-api-6p3b.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API and the database
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            "$API_URL/health?db=true"
