# Keeps the live demo awake.
# Render's free instance sleeps after 15 minutes without traffic, and the first request after that waits
# about a minute. Supabase pauses a free project after a week without use. Every 10 minutes this calls the
# API's health check with a database read, which keeps both awake. If the API or the database is down,
# the run fails and GitHub emails the repo owner.
#
# Free for a public repo. Kept awake all month, the API uses about 720 of Render's 750 free hours.
# GitHub runs free scheduled jobs late or skips them when busy, so this is now the backup: the main
# keep-awake job runs inside Supabase (supabase/migrations/2026-11-08d_keep_awake.sql).
# To stop it: Actions > Keep awake > "..." > Disable workflow.
name: Keep awake

on:
  schedule:
    - cron: "7-59/10 * * * *" # minutes 7, 17, 27...: GitHub is busiest on the hour
  workflow_dispatch: # "Run workflow" button, to wake the API by hand before a demo

env:
  API_URL: https://pramaan-api-6p3b.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API and the database
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            "$API_URL/health?db=true"
